<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECO-KO — Controle de Equipes</title>
  <link rel="stylesheet" href="style.css?v=6.4">
  <script>
    window.addEventListener('error', function(e) {
      const errDiv = document.createElement('div');
      errDiv.style.cssText = 'position:fixed;top:0;left:0;width:100%;background:#ef4444;color:#fff;padding:15px;z-index:999999;font-family:monospace;font-size:12px;white-space:pre-wrap;box-shadow:0 4px 10px rgba(0,0,0,0.5);';
      errDiv.textContent = 'ERRO JS: ' + e.message + '\nArquivo: ' + e.filename + '\nLinha: ' + e.lineno + '\nStack: ' + (e.error ? e.error.stack : 'N/A');
      document.body.appendChild(errDiv);
    });
  </script>
</head>
<body>
  <div id="loginOverlay" style="background: #0f1117; backdrop-filter: blur(10px);">
    <div class="login-box">
      <h2>DECO-KO Login</h2>
      <input type="text" id="loginUser" placeholder="Usuário" aria-label="Usuário" name="username">
      <input type="password" id="loginPass" placeholder="Senha" aria-label="Senha" name="password" onkeypress="if(event.key === 'Enter') checkLogin()">
      <button onclick="checkLogin()">Entrar</button>
      <div id="loginError" class="login-error">Credenciais incorretas!</div>
    </div>
  </div>
  <div class="header">
    <div class="header-row1">
      <h1>🏗️ <span>DECO-KO</span> — Controle de Equipes</h1>
      <div id="snapshotIndicatorSlot"></div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Buscar por nome ou função..." aria-label="Buscar por nome ou função">
      </div>
      <div class="stats">
        <span id="statAllocated">Alocados: 0/141</span>
        <span id="statDuplicates">✅ Sem duplicidades</span>
      </div>
      <button class="btn logout-btn" onclick="logout()" style="margin-left: 8px; background: rgba(239,68,68,0.15); color: #ef4444; border-color: rgba(239,68,68,0.3); font-weight: 600; cursor: pointer;">🚪 Sair</button>
    </div>
    <div class="header-row2">
      <button class="btn" onclick="openHistoryModal()">📋 Planejamentos</button>
      <button class="btn" onclick="openDaySummary()">📊 Resumo do Dia</button>
      <button class="btn" onclick="exportState()">💾 Relatório JSON</button>
      <button class="btn" onclick="exportToPDF()">🖨️ Imprimir/PDF</button>
      <button class="btn" onclick="exportBackup()">📥 Exportar Backup</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">📂 Importar Backup</button>
      <input type="file" id="importFile" style="display:none" accept=".json" aria-label="Importar arquivo de backup JSON" onchange="importBackup(event)">
      <button class="btn danger" onclick="resetState()">↩️ Resetar</button>
    </div>
  </div>

  <div class="app-layout">
    <!-- POOL: fixed left panel -->
    <div class="pool-panel">
      <div class="pool-header">
        <h2>👥 Trabalhadores</h2>
        <span class="count" id="poolCount">141</span>
      </div>
      <div style="padding: 6px 12px; border-bottom: 1px solid var(--border);">
        <select id="poolFilterSelect" aria-label="Filtrar trabalhadores por alocação" style="width:100%; padding: 6px; font-size: 11px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; outline: none; cursor: pointer;">
          <option value="todos">Mostrar Todos</option>
          <option value="alocados">Somente Alocados</option>
          <option value="livres">Não Alocados (Livres)</option>
        </select>
      </div>
      <div class="pool-body" id="poolBody"></div>
    </div>

    <!-- TEAMS: horizontal scroll -->
    <div class="teams-scroll" id="teamsScroll"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="data.js?v=6.4"></script>
  <script src="backup.js?v=6.4"></script>
  <script src="app.js?v=6.4"></script>
</body>
</html>
