<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DECO-KO — Controle de Equipes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loginOverlay" style="background: #0f1117; backdrop-filter: blur(10px);">
    <div class="login-box">
      <h2>DECO-KO Login</h2>
      <input type="text" id="loginUser" placeholder="Usuário">
      <input type="password" id="loginPass" placeholder="Senha" onkeypress="if(event.key === 'Enter') checkLogin()">
      <button onclick="checkLogin()">Entrar</button>
      <div id="loginError" class="login-error">Credenciais incorretas!</div>
    </div>
  </div>
  <div class="header">
    <h1>🏗️ <span>DECO-KO</span> — Controle de Equipes</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Buscar por nome ou função...">
    </div>
    <div class="stats">
      <span id="statAllocated">Alocados: 0/141</span>
      <span id="statDuplicates">✅ Sem duplicidades</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="openHistoryModal()">📋 Histórico</button>
      <button class="btn" onclick="exportState()">💾 Relatório JSON</button>
      <button class="btn" onclick="exportToPDF()">🖨️ Imprimir/PDF</button>
      <button class="btn" onclick="exportBackup()">📥 Exportar Backup</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">📂 Importar Backup</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importBackup(event)">
      <button class="btn danger" onclick="resetState()">↩️ Resetar</button>
    </div>
  </div>

  <div class="app-layout">
    <!-- POOL: fixed left panel -->
    <div class="pool-panel">
      <div class="pool-header">
        <h2>👥 Trabalhadores</h2>
        <span class="count" id="poolCount">141</span>
      </div>
      <div style="padding: 6px 12px; border-bottom: 1px solid var(--border);">
        <select id="poolFilterSelect" style="width:100%; padding: 6px; font-size: 11px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; outline: none; cursor: pointer;">
          <option value="todos">Mostrar Todos</option>
          <option value="alocados">Somente Alocados</option>
          <option value="livres">Não Alocados (Livres)</option>
        </select>
      </div>
      <div class="pool-body" id="poolBody"></div>
    </div>

    <!-- TEAMS: horizontal scroll -->
    <div class="teams-scroll" id="teamsScroll"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
  <script src="data.js"></script>
  <script src="backup.js"></script>
  <script src="app.js"></script>
</body>
</html>
